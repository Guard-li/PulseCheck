name: PulseCheck CI

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  dotnet:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: dotnet restore PulseCheck.sln
      - run: dotnet build PulseCheck.sln -c Release --no-restore
      - run: dotnet run --project tests/PulseCheck.Tests/PulseCheck.Tests.csproj -c Release --no-build
      - run: node --check src/agent-service/wwwroot/app.js
      - run: dotnet publish src/agent-service/PulseCheck.AgentService.csproj -c Release -r win-x64 --self-contained true -p:PublishTrimmed=false -o artifacts/win-x64
      - run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/package.ps1 -BuildDirectory artifacts/win-x64
      - uses: actions/upload-artifact@v4
        with:
          name: pulsecheck-agent-win-x64
          path: artifacts/PulseCheck-*-win-x64.zip

  flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/controller-flutter
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test